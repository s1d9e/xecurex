# Pre-commit hook for XecureX — https://github.com/s1d9e/xecurex
# Usage: add to your .pre-commit-config.yaml (see README).
- id: xecurex
  name: XecureX Security Audit
  description: >-
    Scan the repository for hardcoded secrets, injection, XSS, weak crypto
    and other security issues.
  entry: xecurex
  language: python
  args: ["."]
  pass_filenames: false
